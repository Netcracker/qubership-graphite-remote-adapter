sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.language=go
sonar.sourceEncoding=UTF-8
sonar.go.coverage.reportPaths=coverage.out

# Renovate keeps readable tags with immutable digests for Docker image updates.
sonar.issue.ignore.multicriteria=renovateDockerDigest
sonar.issue.ignore.multicriteria.renovateDockerDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.renovateDockerDigest.resourceKey=**/Dockerfile*
